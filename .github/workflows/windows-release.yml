name: Windows native diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe Framework compiler path handling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ascii=Join-Path $env:RUNNER_TEMP ('native-probe-'+[guid]::NewGuid().ToString('N'))
          $unicode=Join-Path $ascii ('Chosen space-'+[char]0x0438+'-&()')
          [IO.Directory]::CreateDirectory($unicode)|Out-Null
          foreach($environment in @($ascii,$unicode)) {
            foreach($output in @($ascii,$unicode)) {
              $env:TEMP=$environment;$env:TMP=$environment
              $provider=New-Object Microsoft.CSharp.CSharpCodeProvider
              $parameters=New-Object CodeDom.Compiler.CompilerParameters
              $parameters.GenerateInMemory=$true
              $parameters.TempFiles=New-Object CodeDom.Compiler.TempFileCollection($output,$false)
              $result=$provider.CompileAssemblyFromSource($parameters,'public class Probe'+[guid]::NewGuid().ToString('N')+' {}')
              Write-Output ('MATRIX ENV='+$environment+' OUTPUT='+$output+' SUCCESS='+(!$result.Errors.HasErrors))
              $result.Errors | Format-List | Out-String | Write-Output
              $provider.Dispose();$parameters.TempFiles.Dispose()
            }
          }
          $env:TEMP=$unicode;$env:TMP=$unicode
          $short=(New-Object -ComObject Scripting.FileSystemObject).GetFolder($unicode).ShortPath
          Write-Output ('SHORT='+$short)
          $provider=New-Object Microsoft.CSharp.CSharpCodeProvider
          $parameters=New-Object CodeDom.Compiler.CompilerParameters
          $parameters.GenerateInMemory=$true
          $parameters.TempFiles=New-Object CodeDom.Compiler.TempFileCollection($short,$false)
          $result=$provider.CompileAssemblyFromSource($parameters,'public class ProbeShort {}')
          Write-Output ('SHORT OUTPUT SUCCESS='+(!$result.Errors.HasErrors))
          $result.Errors | Format-List | Out-String | Write-Output
          $provider.Dispose();$parameters.TempFiles.Dispose()
      - name: Probe inherited PowerShell module environment
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -Command 'try { Get-Acl -LiteralPath $env:RUNNER_TEMP | Out-Null; "GETACL OK" } catch { $_ | Out-String | Write-Output }; [IO.Directory]::GetAccessControl($env:RUNNER_TEMP).Access | Format-Table | Out-String | Write-Output'
