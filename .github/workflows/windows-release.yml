name: Windows x64 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'olegpro171/Open-Roleplay-Engine'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies and browser engines
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium webkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify sources
        shell: pwsh
        run: |
          node scripts/release/generate-windows-launcher.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build exact main commit with the private Windows runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\build-portable.ps1 -Mode Release -Commit $env:GITHUB_SHA -Destination "$env:RUNNER_TEMP\ORE-ci-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify extracted release
        shell: pwsh
        run: |
          node scripts/release/ci-package-windows.mjs "$env:RUNNER_TEMP\ORE-ci-install" "$env:RUNNER_TEMP\ORE-release" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx tests/support/windows-package-acceptance.ts "$env:RUNNER_TEMP\ORE-release" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified release files for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ORE-release/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ORE-ci-install/logs/
            ${{ runner.temp }}/ORE-package-acceptance-logs/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Serialize publication without interrupting a draft's upload. The publisher
    # also compares commits so an older run cannot replace a newer Latest.
    concurrency:
      group: ore-windows-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: release-files
      - name: Publish complete commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-publish-windows.mjs release-files "$GITHUB_SHA"
