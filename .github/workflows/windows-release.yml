name: Windows x64 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'olegpro171/Open-Roleplay-Engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ore-windows-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Require qualification of the exact promoted commit
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-promote-windows.mjs select "$GITHUB_SHA"
      - name: Download the qualified files without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.qualification.outputs.artifact-id }}
          run-id: ${{ steps.qualification.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: release-files
      - name: Recheck qualification and publish the original files
        env:
          GH_TOKEN: ${{ github.token }}
          ORE_QUALIFIED_RUN: ${{ steps.qualification.outputs.run-id }}
          ORE_QUALIFIED_ARTIFACT: ${{ steps.qualification.outputs.artifact-id }}
        run: node scripts/release/ci-promote-windows.mjs publish "$GITHUB_SHA" release-files
